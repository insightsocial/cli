name: publish

# Push a tag like v0.1.1 to release. npm authenticates this workflow through
# Trusted Publishing (OIDC), so no npm token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - name: server.json matches package version
        run: test "$(node -p 'require("./server.json").version')" = "$(node -p 'require("./package.json").version')"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public --provenance
