name: publish

# Push a tag like v0.1.1 to release. npm authenticates this workflow through
# Trusted Publishing (OIDC), so no npm token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - name: server.json matches package version
        run: test "$(node -p 'require("./server.json").version')" = "$(node -p 'require("./package.json").version')"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      # Idempotent, so a re-run after a registry failure does not fail here.
      - name: npm publish (skipped when this version is already on npm)
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "insightsocial@$VERSION" version >/dev/null 2>&1; then
            echo "insightsocial@$VERSION is already on npm"
          else
            npm publish --access public --provenance
          fi
      # The registry checks npm for the version; a fresh publish takes a moment to appear.
      - name: wait until npm serves this version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          for i in $(seq 1 30); do
            npm view "insightsocial@$VERSION" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "insightsocial@$VERSION never appeared on npm" && exit 1
      - name: publish to the MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain insightsocial.app --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish
